name: AI Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"   # 每天 23:00 UTC = 北京时间 07:00

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run DayBrief
        uses: yoanbernabeu/daybrief@v0.1.0
        with:
          config: config.yaml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          MAIL_FROM_NAME: AI日报
          DAYBRIEF_RECIPIENTS: ${{ secrets.DAYBRIEF_RECIPIENTS }}

      - name: Export Markdown + publish to Pages
        run: |
          mkdir -p daily-md docs
          LATEST=$(ls -t output/*.json | head -n1)
          DATE=$(basename "$LATEST" .json)
          python3 - "$LATEST" "daily-md/$DATE.md" <<'PY'
          import json, sys, re
          src, dst = sys.argv[1], sys.argv[2]
          d = json.load(open(src, encoding="utf-8"))
          L = []
          L.append(f"# {d.get('subject','AI 日报')}\n")
          ed = d.get("editorial","")
          for p in ed.split("\n\n"):
              p = p.strip()
              if p: L.append(p + "\n")
          L.append("\n## 今日要点\n")
          for i, h in enumerate(d.get("highlights", []), 1):
              L.append(f"### {i}. {h.get('title','')}\n")
              L.append(f"- 来源：{h.get('source_name','')} · {h.get('source_url','')}")
              an = h.get("analysis","")
              if an: L.append(f"- 分析：{an}")
              L.append("")
          rs = d.get("resources", [])
          if rs:
              L.append("\n## 其他值得一看\n")
              for r in rs:
                  L.append(f"- [{r.get('title','')}]({r.get('source_url','')})（{r.get('source_name','')}）：{r.get('summary','')}")
          open(dst, "w", encoding="utf-8").write("\n".join(L))
          print("wrote", dst)
          PY
          cp "daily-md/$DATE.md" "docs/index.md"
          printf '# AI 日报归档\n\n' > docs/README.md
          ls -1 daily-md/*.md | sort -r | while read f; do echo "- [$(basename "$f" .md)](https://raw.githubusercontent.com/${{ github.repository }}/main/daily-md/$(basename "$f"))" >> docs/README.md; done

      - name: Telegram notify
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LATEST=$(ls -t output/*.json | head -n1)
          python3 - "$LATEST" <<'PY'
          import json, os, sys, urllib.request
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          tok = os.environ["TELEGRAM_BOT_TOKEN"]; chat = os.environ["TELEGRAM_CHAT_ID"]
          lines = [f"*{d.get('subject','AI 日报')}*", ""]
          for i, h in enumerate(d.get("highlights", []), 1):
              lines.append(f"{i}. [{h.get('title','')}]({h.get('source_url','')})")
              an = h.get("analysis","")
              if an: lines.append(f"   {an[:180]}")
          body = "\n".join(lines)[:3500]
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage",
              data=json.dumps({"chat_id": chat, "text": body, "parse_mode": "Markdown",
                               "disable_web_page_preview": True}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).read().decode())
          PY

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ daily-md/ docs/
          git diff --staged --quiet || git commit -m "chore: AI 日报 $(date -u +%Y-%m-%d)"
          git push
