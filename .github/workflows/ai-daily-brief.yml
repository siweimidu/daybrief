name: AI Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"   # 每天 23:00 UTC = 北京时间 07:00

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Generate daily brief
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          BRIEF_MAX_ITEMS: "30"
          BRIEF_BATCH: "8"
          BRIEF_DEADLINE_S: "1200"
        run: python3 scripts/groq_brief.py --config config.yaml --lookback 48h

      - name: Build static site
        run: |
          mkdir -p site
          ls daily-md/*.md || exit 0
          python3 - <<'PY'
          import glob, os, html
          files = sorted(glob.glob("daily-md/*.md"), reverse=True)
          latest = files[0]
          md = open(latest, encoding="utf-8").read()
          body = []
          for line in md.splitlines():
              e = html.escape(line)
              if line.startswith("# "):
                  body.append("<h1>" + e[2:] + "</h1>")
              elif line.startswith("## "):
                  body.append("<h2>" + e[3:] + "</h2>")
              elif line.startswith("### "):
                  body.append("<h3>" + e[4:] + "</h3>")
              elif line.startswith("> "):
                  body.append('<p class="meta">' + e[2:] + "</p>")
              elif line.startswith("- "):
                  body.append("<li>" + e[2:] + "</li>")
              elif line.strip():
                  body.append("<p>" + e + "</p>")
          links = "".join(
              '<li><a href="%s.html">%s</a></li>' % (os.path.basename(f)[:-3], os.path.basename(f)[:-3])
              for f in files[:30]
          )
          page = """<!doctype html><html lang="zh"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AI 日报</title><style>
          body{max-width:760px;margin:24px auto;padding:0 16px;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;color:#222;line-height:1.75}
          h1{font-size:24px}h2{margin-top:28px;border-bottom:1px solid #eee;padding-bottom:6px}
          .meta{color:#888;font-size:13px}li{margin:6px 0}a{color:#2563eb}
          nav{margin-top:36px;border-top:1px solid #eee;padding-top:14px}</style></head>
          <body>%s<nav><strong>历史日报</strong><ul>%s</ul></nav></body></html>""" % ("\n".join(body), links)
          open("site/index.html", "w", encoding="utf-8").write(page)
          for f in files:
              d = os.path.basename(f)[:-3]
              src = "output/%s.html" % d
              if os.path.exists(src):
                  open("site/%s.html" % d, "w", encoding="utf-8").write(open(src, encoding="utf-8").read())
          print("site built:", len(files), "issues")
          PY

      - name: Upload Pages artifact
        if: ${{ hashFiles('site/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Send email (QQ SMTP)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
          DAYBRIEF_RECIPIENTS: ${{ secrets.DAYBRIEF_RECIPIENTS }}
        run: |
          LATEST=$(ls -t output/*.html 2>/dev/null | head -n1 || true)
          [ -z "$LATEST" ] && { echo "no html"; exit 0; }
          python3 - "$LATEST" <<'PY'
          import os, smtplib, ssl, sys
          from email.header import Header
          from email.mime.text import MIMEText
          html_path = sys.argv[1]
          html_body = open(html_path, encoding="utf-8").read()
          subject = "AI 日报 " + os.path.basename(html_path).replace(".html", "")
          msg = MIMEText(html_body, "html", "utf-8")
          msg["Subject"] = Header(subject, "utf-8")
          msg["From"] = os.environ["MAIL_FROM_EMAIL"]
          msg["To"] = os.environ["DAYBRIEF_RECIPIENTS"]
          host = os.environ["SMTP_HOST"]
          port = int(os.environ.get("SMTP_PORT", "465"))
          user = os.environ["SMTP_USERNAME"]
          pwd = os.environ["SMTP_PASSWORD"]
          if pwd.startswith("PLACEHOLDER"):
              print("SMTP_PASSWORD 仍是占位符，跳过发信")
              sys.exit(0)
          recipients = os.environ["DAYBRIEF_RECIPIENTS"].split(",")
          if port == 465:
              ctx = ssl.create_default_context()
              with smtplib.SMTP_SSL(host, port, context=ctx, timeout=30) as s:
                  s.login(user, pwd)
                  s.sendmail(user, recipients, msg.as_string())
          else:
              with smtplib.SMTP(host, port, timeout=30) as s:
                  s.starttls()
                  s.login(user, pwd)
                  s.sendmail(user, recipients, msg.as_string())
          print("email sent to", os.environ["DAYBRIEF_RECIPIENTS"])
          PY

      - name: Telegram notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LATEST=$(ls -t daily-md/*.md 2>/dev/null | head -n1 || true)
          [ -z "$LATEST" ] && exit 0
          python3 - "$LATEST" <<'PY'
          import json, os, sys, urllib.request, pathlib
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN", ""), os.environ.get("TELEGRAM_CHAT_ID", "")
          if not tok or not chat:
              print("telegram secrets missing, skip"); sys.exit(0)
          md = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          body = md[:3800]
          req = urllib.request.Request(
              "https://api.telegram.org/bot%s/sendMessage" % tok,
              data=json.dumps({"chat_id": chat, "text": body, "disable_web_page_preview": True}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).read().decode()[:200])
          PY

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ daily-md/ site/ || true
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore: AI 日报 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main && git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

  deploy:
    needs: brief
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
